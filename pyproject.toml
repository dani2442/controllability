[project]
name = "controllability-code"
version = "0.1.0"
description = "Numerical experiments for data-driven control in infinite-dimensional spaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.8.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pytest>=8.0",
    "scipy>=1.14.0",
    "torch>=2.9.1",
    "torchsde>=0.2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddinf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
